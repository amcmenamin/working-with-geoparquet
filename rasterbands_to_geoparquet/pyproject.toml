[project]
name = "rasterbands-to-geoparquet"
version = "0.1.0"
description = "Convert local or cloud-hosted raster cells and band values to GeoParquet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geopandas>=1.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "rasterio>=1.4",
    "shapely>=2.0",
]

[project.scripts]
rasterbands-to-geoparquet = "src.raster_to_parquet_cli:main"
raster-to-bands = "src.raster_to_bands_cli:main"
raster-polygonize = "src.raster_polygonize_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
]
